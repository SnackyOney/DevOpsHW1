services:
  nginx:
    image: nginx:alpine
    container_name: app-proxy
    ports:
      - "8000:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - app
    networks:
      - app-net
    restart: unless-stopped

  app:
    image: nginx:alpine
    container_name: app-backend
    volumes:
      - ./html:/usr/share/nginx/html:ro
    networks:
      - app-net
    restart: unless-stopped

networks:
  app-net:
    driver: bridge
